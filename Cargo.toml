[package]
name = "whisper-pause-break"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local Windows push-to-talk dictation with Whisper and optional CUDA"
license = "MIT"
authors = ["Steven Cheatham <steven@stevencheatham.com>"]
repository = "https://github.com/BitwiseAnvil/whisper-pause-break"
homepage = "https://bitwiseanvil.com/"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5"
hound = "3.5"
rubato = "0.16.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio",
    "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
